name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/aphone.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/aphone-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: softphone-apks
          path: dist/*.apk
      # Rolling "latest" release so there is a stable, phone-friendly download link.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/aphone.apk dist/aphone-debug.apk \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}" --latest

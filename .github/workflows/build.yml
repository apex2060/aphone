name: Build APK

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName when this run is not a tag (optional, for example 1.2.3)"
        required: false
        type: string

# Release creation needs contents: write. Pull-request builds only compile.
permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Write google-services.json when the secret is set
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash .github/workflows/write-google-services.sh
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ANDROID_KEYSTORE_BASE64}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${ANDROID_KEY_ALIAS}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${ANDROID_KEY_PASSWORD}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Refusing to build a release APK. Missing repository secret(s): ${missing[*]}."
            echo "::error::This workflow will not publish an unsigned or debug-signed APK. Add the secrets, then re-run."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json when the secret is set
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash .github/workflows/write-google-services.sh

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/22phone-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null; then
            echo "::error::Could not unlock the keystore or ANDROID_KEY_ALIAS was not found. Check ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and that ANDROID_KEYSTORE_BASE64 is the keystore file itself (not a zip)."
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version_name="${GITHUB_REF_NAME#v}"
          elif [ -n "${VERSION_INPUT}" ]; then
            version_name="${VERSION_INPUT#v}"
          else
            version_name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          case "$version_name" in
            ""|*[!A-Za-z0-9.+_-]*)
              echo "::error::versionName '${version_name}' is empty or contains unsupported characters."
              exit 1
              ;;
          esac
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/22phone-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}"
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signed release APK was not produced. Refusing to publish an unsigned build."
            ls -la app/build/outputs/apk/release 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/22phone.apk

      - name: Verify signature and version
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$apksigner" ] || [ -z "$aapt" ]; then
            echo "::error::apksigner or aapt was not found under ${sdk}. Cannot confirm the APK is signed."
            exit 1
          fi
          "$apksigner" verify --verbose dist/22phone.apk
          certs="$("$apksigner" verify --print-certs dist/22phone.apk)"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the Android debug certificate. Refusing to publish it."
            exit 1
          fi
          badging="$("$aapt" dump badging dist/22phone.apk)"
          printf '%s\n' "$badging" | grep -E "package:|application-label:"
          printf '%s\n' "$badging" | grep -F -q "versionCode='${VERSION_CODE}'"
          printf '%s\n' "$badging" | grep -F -q "versionName='${VERSION_NAME}'"
          printf '%s\n' "$badging" | grep -F -q "application-label:'22 Phone'"

      - uses: actions/upload-artifact@v4
        with:
          name: 22phone
          path: dist/22phone.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=$(printf '%s\n' \
            "Signed 22 Phone release." \
            "" \
            "- versionName: ${VERSION_NAME}" \
            "- versionCode: ${VERSION_CODE}" \
            "" \
            "Download 22phone.apk from this release, then update the Google Drive link used to install the app.")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/22phone.apk --clobber
          else
            gh release create "$tag" dist/22phone.apk --title "$tag" --notes "$notes"
          fi

name: SIP spike APK

on:
  pull_request:
    paths:
      - "sipspike/**"
      - ".github/workflows/spike-release.yml"
  push:
    tags:
      - "spike-*"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the spike debug APK
        run: |
          set -euo pipefail
          ./gradlew -p sipspike --no-daemon testDebugUnitTest assembleDebug
          python3 sipspike/third_party/check-elf-alignment.py \
            sipspike/build/outputs/apk/debug/sipspike-debug.apk

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ANDROID_KEYSTORE_BASE64}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${ANDROID_KEY_ALIAS}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${ANDROID_KEY_PASSWORD}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Refusing to build the spike APK. Missing repository secret(s): ${missing[*]}."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/22phone-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null; then
            echo "::error::Could not unlock the keystore or ANDROID_KEY_ALIAS was not found."
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            spike-*) ;;
            *)
              echo "::error::Refusing tag ${tag}. Spike releases use spike-* tags, not v* tags."
              exit 1
              ;;
          esac
          if [ "$tag" = "spike-pjsip-v0.6-official" ]; then
            version_name="1.1.0"
            version_code="15"
            official="true"
          elif [ "$tag" = "spike-pjsip-v0.7-official" ]; then
            version_name="1.1.1"
            version_code="16"
            official="true"
          elif [ "$tag" = "spike-pjsip-v0.8-official" ]; then
            version_name="1.1.2"
            version_code="17"
            official="true"
          elif [ "$tag" = "spike-pjsip-v0.9-official" ]; then
            version_name="1.2.0"
            version_code="18"
            official="true"
          elif [ "$tag" = "spike-pjsip-v0.10-official" ]; then
            version_name="1.2.1"
            version_code="19"
            official="true"
          else
            version_name="${tag#spike-pjsip-v}"
            if [ "$version_name" = "$tag" ]; then
              version_name="$tag"
            fi
            version_code="${GITHUB_RUN_NUMBER}"
            official="false"
          fi
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "official=${official}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "OFFICIAL=${official}" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        if: env.OFFICIAL == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -d "$sdk/platforms/android-36" ]; then
            echo "platforms;android-36 already installed"
            exit 0
          fi
          sm="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$sm" ]; then
            echo "::error::sdkmanager was not found under ${sdk}."
            exit 1
          fi
          yes | "$sm" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sm" --sdk_root="$sdk" "platforms;android-36"

      - name: Build signed official APK and AAB
        if: env.OFFICIAL == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/22phone-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}"
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$apk" ] || [ ! -f "$aab" ]; then
            echo "::error::Signed 22 Phone APK or AAB was not produced."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/22phone.apk
          cp "$aab" dist/22phone.aab

      - name: Build signed spike APK
        if: env.OFFICIAL != 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/22phone-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew -p sipspike --no-daemon assembleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}"
          apk="sipspike/build/outputs/apk/release/sipspike-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signed spike APK was not produced."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/22siptest.apk

      - name: Verify official signature, package, and 16 KB alignment
        if: env.OFFICIAL == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$apksigner" ] || [ -z "$aapt" ]; then
            echo "::error::apksigner or aapt was not found under ${sdk}."
            exit 1
          fi
          "$apksigner" verify --verbose dist/22phone.apk
          certs="$("$apksigner" verify --print-certs dist/22phone.apk)"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the Android debug certificate."
            exit 1
          fi
          if ! printf '%s\n' "$certs" | grep -q "CN=22 Phone"; then
            echo "::error::APK is not signed with CN=22 Phone, so it cannot upgrade v1.0.5."
            exit 1
          fi
          badging="$("$aapt" dump badging dist/22phone.apk)"
          printf '%s\n' "$badging" | grep -E "package:|application-label:|native-code:"
          printf '%s\n' "$badging" | grep -F -q "package: name='com.apex2060.softphone'"
          printf '%s\n' "$badging" | grep -F -q "versionCode='${VERSION_CODE}'"
          printf '%s\n' "$badging" | grep -F -q "versionName='${VERSION_NAME}'"
          printf '%s\n' "$badging" | grep -F -q "application-label:'22 Phone'"
          python3 sipspike/third_party/check-elf-alignment.py dist/22phone.apk
          zipalign="$(find "$sdk/build-tools" -type f -name zipalign | sort -V | tail -1)"
          if [ -z "$zipalign" ]; then
            echo "::error::zipalign was not found under ${sdk}."
            exit 1
          fi
          "$zipalign" -c -P 16 -v 4 dist/22phone.apk
          readelf_bin="$(command -v readelf || true)"
          if [ -z "$readelf_bin" ]; then
            readelf_bin="$(find "$sdk/ndk" -type f -name llvm-readelf | sort -V | tail -1)"
          fi
          if [ -z "$readelf_bin" ]; then
            echo "::error::readelf was not found."
            exit 1
          fi
          native="$(mktemp -d)"
          unzip -q dist/22phone.apk 'lib/*/*.so' -d "$native"
          python3 - "$readelf_bin" "$native" <<'PY'
          import pathlib, subprocess, sys
          readelf, root = sys.argv[1], pathlib.Path(sys.argv[2])
          sos = sorted(root.rglob("*.so"))
          if not any(path.name == "libpjsua2.so" for path in sos):
              raise SystemExit("libpjsua2.so is missing from the APK")
          failed = False
          for so in sos:
              out = subprocess.check_output([readelf, "-lW", str(so)], text=True)
              print(f"== {so.name}")
              aligns = []
              for line in out.splitlines():
                  parts = line.split()
                  if parts and parts[0] == "LOAD":
                      aligns.append(int(parts[-1], 16))
                      print(line)
              if not aligns or any(align < 0x4000 for align in aligns):
                  print(f"FAIL {so.name} p_align={aligns}")
                  failed = True
          if failed:
              raise SystemExit("ELF LOAD alignment is below 0x4000")
          PY
          if ! jarsigner -verify dist/22phone.aab; then
            echo "::error::AAB signature verification failed."
            exit 1
          fi
          aab_cert="$(unzip -Z1 dist/22phone.aab | grep -E 'META-INF/.*\.(RSA|DSA|EC)$' | head -1)"
          if [ -z "$aab_cert" ]; then
            echo "::error::AAB has no signature block."
            exit 1
          fi
          aab_out="$(unzip -p dist/22phone.aab "$aab_cert" | keytool -printcert)"
          printf '%s\n' "$aab_out"
          if printf '%s\n' "$aab_out" | grep -q "CN=Android Debug"; then
            echo "::error::AAB is signed with the Android debug certificate."
            exit 1
          fi
          if ! printf '%s\n' "$aab_out" | grep -q "CN=22 Phone"; then
            echo "::error::AAB is not signed with CN=22 Phone."
            exit 1
          fi
          aab_native="$(mktemp -d)"
          unzip -q dist/22phone.aab 'base/lib/*/*.so' -d "$aab_native"
          python3 - "$readelf_bin" "$aab_native" <<'PY'
          import pathlib, subprocess, sys
          readelf, root = sys.argv[1], pathlib.Path(sys.argv[2])
          sos = sorted(root.rglob("*.so"))
          if not sos:
              raise SystemExit("AAB contains no native libraries")
          failed = False
          for so in sos:
              out = subprocess.check_output([readelf, "-lW", str(so)], text=True)
              aligns = [int(line.split()[-1], 16) for line in out.splitlines() if line.split()[:1] == ["LOAD"]]
              print(f"{so.name} p_align={[hex(a) for a in aligns]}")
              if not aligns or any(align < 0x4000 for align in aligns):
                  failed = True
          if failed:
              raise SystemExit("AAB ELF LOAD alignment is below 0x4000")
          PY

      - name: Verify spike signature, package, and 16 KB alignment
        if: env.OFFICIAL != 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$apksigner" ] || [ -z "$aapt" ]; then
            echo "::error::apksigner or aapt was not found under ${sdk}."
            exit 1
          fi
          "$apksigner" verify --verbose dist/22siptest.apk
          certs="$("$apksigner" verify --print-certs dist/22siptest.apk)"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the Android debug certificate."
            exit 1
          fi
          badging="$("$aapt" dump badging dist/22siptest.apk)"
          printf '%s\n' "$badging" | grep -E "package:|application-label:"
          printf '%s\n' "$badging" | grep -F -q "package: name='com.twentytwo.phone.sipspike'"
          printf '%s\n' "$badging" | grep -F -q "versionCode='${VERSION_CODE}'"
          printf '%s\n' "$badging" | grep -F -q "versionName='${VERSION_NAME}'"
          printf '%s\n' "$badging" | grep -F -q "application-label:'22 SIP Test'"
          python3 sipspike/third_party/check-elf-alignment.py dist/22siptest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OFFICIAL == 'true' && '22phone' || '22siptest' }}
          path: dist/
          if-no-files-found: error

      - name: Attach APK to a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${OFFICIAL}" = "true" ]; then
            assets=(dist/22phone.apk dist/22phone.aab)
            notes=$(printf '%s\n' \
              "Signed 22 Phone test build. This is not a v* release and it is not merged." \
              "" \
              "- package: com.apex2060.softphone" \
              "- versionName: ${VERSION_NAME}" \
              "- versionCode: ${VERSION_CODE} (v1.0.5 is versionCode 14)" \
              "- label: 22 Phone" \
              "- targetSdk: 36" \
              "- PJSIP 2.17 (GPL-2.0-or-later) and OpenSSL 3.5.4 (Apache-2.0)" \
              "" \
              "22phone.apk is the sideload build. 22phone.aab is the Play App Bundle, signed with the same key." \
              "Install the APK over 22 Phone v1.0.5. The signing certificate is CN=22 Phone." \
              "Source for this binary is this tag plus the upstream tarballs named in sipspike/third_party/VERSIONS.txt.")
          else
            assets=(dist/22siptest.apk)
            notes=$(printf '%s\n' \
              "Throwaway 22 SIP Test build. This is not a 22 Phone release." \
              "" \
              "- package: com.twentytwo.phone.sipspike" \
              "- versionName: ${VERSION_NAME}" \
              "- versionCode: ${VERSION_CODE}" \
              "- PJSIP 2.17 (GPL-2.0-or-later) and OpenSSL 3.5.4 (Apache-2.0)" \
              "" \
              "Install beside 22 Phone. Test steps are in sipspike/README.md." \
              "Source for this binary is this tag plus the upstream tarballs named in sipspike/third_party/VERSIONS.txt.")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --prerelease \
              --title "$tag" \
              --notes "$notes"
          fi
